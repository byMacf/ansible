---
- name: Backup Switch and Router Configurations
  hosts: switches
  gather_facts: no
  vars:
    backup_dir: "/data/device_backups/{{ inventory_hostname }}/"

  tasks:
    - name: Ensure backup directory exists
      delegate_to: localhost
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'

    # Cisco IOS
    - name: Save Cisco running config to startup config
      ios_command:
        commands:
          - write memory
      when: ansible_network_os == 'ios'

    - name: Backup Cisco running-config
      ios_config:
        backup: yes
        backup_options:
          filename: "{{ backup_dir }}{{ inventory_hostname }}_{{ lookup('pipe','date +%Y-%m-%d') }}.cfg"
      when: ansible_network_os == 'ios'

    # Juniper JunOS
    - name: Save Juniper rescue config
      junos_command:
        commands:
          - request system configuration rescue save
      when: ansible_network_os == 'junos'

    - name: Fetch EX2200 config via CLI
      junos_command:
        commands:
          - show configuration | display set
        display: text
      register: ex2200_cfg
      when: inventory_hostname == 'LAB-EX2200'

    - name: Backup EX2200 config
      copy:
        content: "{{ ex2200_cfg.stdout[0] }}"
        dest: "{{ backup_dir }}{{ inventory_hostname }}_{{ lookup('pipe','date +%Y-%m-%d') }}.cfg"
      delegate_to: localhost
      when: inventory_hostname == 'LAB-EX2200'

    - name: Backup Juniper config
      junos_config:
        backup: yes
        backup_options: 
          filename: "{{ backup_dir }}{{ inventory_hostname }}_{{ lookup('pipe','date +%Y-%m-%d') }}.cfg"
      when: ansible_network_os == 'junos' and inventory_hostname != 'LAB-EX2200'

